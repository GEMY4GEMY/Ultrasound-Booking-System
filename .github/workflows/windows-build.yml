name: Windows x64 Build V186
permissions:
  contents: write
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Validate frontend JavaScript syntax
        shell: powershell
        run: node --check wwwroot/arabic-v2.js
      - name: Validate V2 dialog references
        shell: powershell
        run: |
          $html = Get-Content "wwwroot/index.html" -Raw
          $js = Get-Content "wwwroot/arabic-v2.js" -Raw
          $ids = [regex]::Matches($html, 'id="([^"]+Dlg)"') | ForEach-Object { $_.Groups[1].Value }
          $refs = [regex]::Matches($js, "([A-Za-z_][A-Za-z0-9_]*Dlg)=el\('([^']+Dlg)'\)") 
          foreach ($m in $refs) {
            $id = $m.Groups[2].Value
            if ($ids -notcontains $id) { throw "JavaScript dialog reference has no matching HTML id: $id" }
          }
          foreach ($id in $ids) {
            if ($js -match "\b$id\.(showModal|close)\(" -and $js -notmatch "$id=el\('$id'\)") {
              throw "Dialog used without explicit JavaScript reference: $id"
            }
          }
      - name: Validate all inline UI handlers
        shell: powershell
        run: |
          $html = Get-Content "wwwroot/index.html" -Raw
          $js = Get-Content "wwwroot/arabic-v2.js" -Raw
          $matches = [regex]::Matches($html, 'on(?:click|change|input|submit)="([A-Za-z_$][A-Za-z0-9_$]*)\s*\(')
          $handlers = $matches | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          foreach ($handler in $handlers) {
            if ($js -notmatch ("(?:async\s+)?function\s+" + [regex]::Escape($handler) + "\s*\(")) {
              throw "HTML event handler has no JavaScript function: $handler"
            }
          }
          Write-Host ("Validated {0} inline UI handlers." -f $handlers.Count)
          if ($html -notmatch 'id="insurer"') { throw "Booking contract/insurer selector is missing from HTML" }
          if ($html -match 'id="contract"') { throw "Legacy booking contract selector unexpectedly returned" }
          if ($js -match "el\('contract'\)") { throw "JavaScript still references removed contract selector and will break booking save" }
          if ($js -notmatch "contractType:'تعاقد',insurer:el\('insurer'\)\.value") { throw "Booking payload is not wired to selected contract entity" }
          Write-Host "Validated booking form fields against JavaScript save logic."
      - name: Publish Windows x64
        run: dotnet publish --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output publish
      - name: Add network deployment tools
        shell: powershell
        run: |
          Copy-Item "Start-Ultrasound-Server.cmd" "publish\Start-Ultrasound-Server.cmd"
          Copy-Item "Server-Watchdog.ps1" "publish\Server-Watchdog.ps1"
          Copy-Item "Install-AutoStart.cmd" "publish\Install-AutoStart.cmd"
          Copy-Item "Install-AutoStart.ps1" "publish\Install-AutoStart.ps1"
          Copy-Item "Setup-Network-Firewall.cmd" "publish\Setup-Network-Firewall.cmd"
          Copy-Item "NETWORK-SETUP.txt" "publish\NETWORK-SETUP.txt"
      - name: Runtime smoke test published server
        shell: pwsh
        run: |
          $exe = (Get-ChildItem "publish\*.exe" | Select-Object -First 1).FullName
          $proc = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:5090/api/health" -TimeoutSec 2
                $ready = $true
                break
              } catch {}
            }
            if (-not $ready) { throw "Published server did not become healthy on port 5090" }
            $page = (Invoke-WebRequest "http://127.0.0.1:5090/" -UseBasicParsing).Content
            if ($page -notmatch 'arabic-v2\.js\?v=186') { throw "Published homepage does not reference the expected V2 JavaScript" }
            if ($page -match '[A-Za-z0-9_]+Dlg\.close\(\)') { throw "Published homepage still depends on browser-global dialog variables" }
            $js = (Invoke-WebRequest "http://127.0.0.1:5090/arabic-v2.js?v=186" -UseBasicParsing).Content
            if ($js -notmatch 'function\s+closeDialog\s*\(') { throw "Explicit dialog close handler is missing" }
            foreach ($fn in @('openListDialog','quick','openAdmin','openAbout','saveBooking')) {
              if ($js -notmatch ("function\s+" + $fn + "\s*\(")) { throw "Missing frontend handler: $fn" }
            }
            $adminOkBody = @{ pin="1234"; actor="CI Admin Test" } | ConvertTo-Json
            $adminOk = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:5090/api/v2/admin/login" -ContentType "application/json; charset=utf-8" -Body $adminOkBody
            if (-not $adminOk.token) { throw "Default admin PIN did not return an admin token" }
            $badAdminBody = @{ pin="9999"; actor="CI Admin Test" } | ConvertTo-Json
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              $badRejected = $false
              try { Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:5090/api/v2/admin/login" -ContentType "application/json; charset=utf-8" -Body $badAdminBody | Out-Null }
              catch { if ($_.Exception.Response.StatusCode.value__ -eq 401) { $badRejected = $true } else { throw } }
              if (-not $badRejected) { throw "Invalid admin PIN attempt $attempt was not rejected with 401" }
            }
            $lockedAdmin = $false
            try { Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:5090/api/v2/admin/login" -ContentType "application/json; charset=utf-8" -Body $adminOkBody | Out-Null }
            catch { if ($_.Exception.Response.StatusCode.value__ -eq 429) { $lockedAdmin = $true } else { throw } }
            if (-not $lockedAdmin) { throw "Admin brute-force lockout did not activate after five failed PIN attempts" }
            $version = Invoke-RestMethod "http://127.0.0.1:5090/api/version"
            if ($version.version -ne "V186") { throw "Wrong server version is running: $($version.version)" }
            $lists = Invoke-RestMethod "http://127.0.0.1:5090/api/v2/lists"
            $doctors = Invoke-RestMethod "http://127.0.0.1:5090/api/v2/doctors"
            if (-not $doctors -or $doctors.Count -lt 1) { throw "No doctor is available for booking smoke test" }
            $doctor = [string]$doctors[0]
            $testDate = (Get-Date).Date.AddDays(365).ToString("yyyy-MM-dd")
            $listBody = @{ date=$testDate; doctor=$doctor; shift="صباحي"; actor="CI Smoke Test" } | ConvertTo-Json
            $list = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:5090/api/v2/lists" -ContentType "application/json; charset=utf-8" -Body $listBody
            if (-not $list.id) { throw "Daily list creation failed" }
            $pastDate = (Get-Date).Date.AddDays(-30).ToString("yyyy-MM-dd")
            $futureDate = (Get-Date).Date.AddDays(395).ToString("yyyy-MM-dd")
            $pastBody = @{ date=$pastDate; doctor=$doctor; shift="صباحي"; actor="CI Smoke Test" } | ConvertTo-Json
            $futureBody = @{ date=$futureDate; doctor=$doctor; shift="صباحي"; actor="CI Smoke Test" } | ConvertTo-Json
            $pastList = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:5090/api/v2/lists" -ContentType "application/json; charset=utf-8" -Body $pastBody
            $futureList = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:5090/api/v2/lists" -ContentType "application/json; charset=utf-8" -Body $futureBody
            if (-not $pastList.id -or -not $futureList.id) { throw "Past/future daily list creation failed" }
            if ($pastList.id -eq $futureList.id -or $pastList.id -eq $list.id) { throw "Lists on different dates were incorrectly treated as duplicates" }
            $phone = "01000000000"
            $bookingBody = @{ listId=$list.id; patientName="CI Patient"; phone=$phone; contractType="تعاقد"; insurer="تعاقد"; exam="CI Exam"; notes="Automated smoke test"; actor="CI Smoke Test" } | ConvertTo-Json
            $booking = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:5090/api/v2/bookings" -ContentType "application/json; charset=utf-8" -Body $bookingBody
            if (-not $booking.patientId) { throw "Booking did not receive a patient ID" }
            $afterCreate = @(Invoke-RestMethod "http://127.0.0.1:5090/api/v2/bookings")
            $visible = $afterCreate | Where-Object { $_.id -eq $booking.id -and $_.listId -eq $list.id }
            if (-not $visible) { throw "Created booking is not visible inside its daily list" }
            if ($visible.status -ne "محجوز") { throw "Created booking did not start with reserved status" }
            $attendBody = @{ status="تم الحضور"; actor="CI Smoke Test" } | ConvertTo-Json
            Invoke-RestMethod -Method Put -Uri ("http://127.0.0.1:5090/api/v2/bookings/" + $booking.id + "/status") -ContentType "application/json; charset=utf-8" -Body $attendBody | Out-Null
            $afterStatus = @(Invoke-RestMethod "http://127.0.0.1:5090/api/v2/bookings")
            $statusVisible = $afterStatus | Where-Object { $_.id -eq $booking.id -and $_.status -eq "تم الحضور" }
            if (-not $statusVisible) { throw "Booking status change was not visible after reload" }
            $reserveBody = @{ status="محجوز"; actor="CI Smoke Test" } | ConvertTo-Json
            Invoke-RestMethod -Method Put -Uri ("http://127.0.0.1:5090/api/v2/bookings/" + $booking.id + "/status") -ContentType "application/json; charset=utf-8" -Body $reserveBody | Out-Null
            $patient = Invoke-RestMethod ("http://127.0.0.1:5090/api/v2/patients/by-phone?phone=" + $phone)
            if ($patient.patientId -ne $booking.patientId) { throw "Patient phone lookup did not return the booking patient ID" }
            $badBody = @{ listId=$list.id; patientName="CI Insured"; phone="01000000001"; contractType="تأمين"; insurer=""; exam="CI Exam"; actor="CI Smoke Test" } | ConvertTo-Json
            $rejected = $false
            try { Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:5090/api/v2/bookings" -ContentType "application/json; charset=utf-8" -Body $badBody | Out-Null }
            catch { if ($_.Exception.Response.StatusCode.value__ -eq 400) { $rejected = $true } else { throw } }
            if (-not $rejected) { throw "Insured booking without insurer was accepted" }
            $badDoctorBody = @{ date=$testDate; doctor="CI Unregistered Doctor"; shift="مسائي"; actor="CI Smoke Test" } | ConvertTo-Json
            $doctorRejected = $false
            try { Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:5090/api/v2/lists" -ContentType "application/json; charset=utf-8" -Body $badDoctorBody | Out-Null }
            catch { if ($_.Exception.Response.StatusCode.value__ -eq 400) { $doctorRejected = $true } else { throw } }
            if (-not $doctorRejected) { throw "Daily list accepted an unregistered doctor" }
            $stateBody = @{ state="مكتملة"; actor="CI Smoke Test" } | ConvertTo-Json
            Invoke-RestMethod -Method Put -Uri ("http://127.0.0.1:5090/api/v2/lists/" + $list.id + "/state") -ContentType "application/json; charset=utf-8" -Body $stateBody | Out-Null
            $statusBody = @{ status="تم الحضور"; actor="CI Smoke Test" } | ConvertTo-Json
            $completedRejected = $false
            try { Invoke-RestMethod -Method Put -Uri ("http://127.0.0.1:5090/api/v2/bookings/" + $booking.id + "/status") -ContentType "application/json; charset=utf-8" -Body $statusBody | Out-Null }
            catch { if ($_.Exception.Response.StatusCode.value__ -eq 409) { $completedRejected = $true } else { throw } }
            if (-not $completedRejected) { throw "Completed daily list allowed booking status mutation" }
            $lockedBookingBody = @{ listId=$list.id; patientName="CI Locked"; phone="01000000002"; contractType="تعاقد"; insurer="تعاقد"; exam="CI Exam"; actor="CI Smoke Test" } | ConvertTo-Json
            $lockedBookingRejected = $false
            try { Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:5090/api/v2/bookings" -ContentType "application/json; charset=utf-8" -Body $lockedBookingBody | Out-Null }
            catch { if ($_.Exception.Response.StatusCode.value__ -eq 409) { $lockedBookingRejected = $true } else { throw } }
            if (-not $lockedBookingRejected) { throw "Completed daily list accepted a new booking" }
            $reopenBody = @{ state="مفتوحة"; actor="CI Smoke Test" } | ConvertTo-Json
            Invoke-RestMethod -Method Put -Uri ("http://127.0.0.1:5090/api/v2/lists/" + $list.id + "/state") -ContentType "application/json; charset=utf-8" -Body $reopenBody | Out-Null
            $targetDate = (Get-Date).Date.AddDays(366).ToString("yyyy-MM-dd")
            $targetBody = @{ date=$targetDate; doctor=$doctor; shift="مسائي"; actor="CI Smoke Test" } | ConvertTo-Json
            $target = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:5090/api/v2/lists" -ContentType "application/json; charset=utf-8" -Body $targetBody
            $lockTargetBody = @{ state="مقفلة"; actor="CI Smoke Test" } | ConvertTo-Json
            Invoke-RestMethod -Method Put -Uri ("http://127.0.0.1:5090/api/v2/lists/" + $target.id + "/state") -ContentType "application/json; charset=utf-8" -Body $lockTargetBody | Out-Null
            $moveBody = @{ listId=$target.id; actor="CI Smoke Test" } | ConvertTo-Json
            $moveRejected = $false
            try { Invoke-RestMethod -Method Put -Uri ("http://127.0.0.1:5090/api/v2/bookings/" + $booking.id + "/move") -ContentType "application/json; charset=utf-8" -Body $moveBody | Out-Null }
            catch { if ($_.Exception.Response.StatusCode.value__ -eq 409) { $moveRejected = $true } else { throw } }
            if (-not $moveRejected) { throw "Booking moved into a locked target list" }
            $openTargetBody = @{ state="مفتوحة"; actor="CI Smoke Test" } | ConvertTo-Json
            Invoke-RestMethod -Method Put -Uri ("http://127.0.0.1:5090/api/v2/lists/" + $target.id + "/state") -ContentType "application/json; charset=utf-8" -Body $openTargetBody | Out-Null
            $moved = Invoke-RestMethod -Method Put -Uri ("http://127.0.0.1:5090/api/v2/bookings/" + $booking.id + "/move") -ContentType "application/json; charset=utf-8" -Body $moveBody
            if ($moved.listId -ne $target.id) { throw "Moved booking did not receive target list ID" }
            if ([string]$moved.doctor -ne [string]$target.doctor) { throw "Moved booking doctor does not match target list" }
            if ([string]$moved.shift -ne [string]$target.shift) { throw "Moved booking shift does not match target list" }
            if ((Get-Date $moved.date).Date -ne (Get-Date $target.date).Date) { throw "Moved booking date does not match target list" }
            $deleteBody = @{ reason="CI cleanup verification"; actor="CI Smoke Test" } | ConvertTo-Json
            Invoke-RestMethod -Method Delete -Uri ("http://127.0.0.1:5090/api/v2/bookings/" + $booking.id) -ContentType "application/json; charset=utf-8" -Body $deleteBody | Out-Null
            $visibleBookings = @(Invoke-RestMethod "http://127.0.0.1:5090/api/v2/bookings")
            if ($visibleBookings | Where-Object { $_.id -eq $booking.id }) { throw "Soft-deleted booking remained visible in normal booking list" }
            $allBookings = @(Invoke-RestMethod "http://127.0.0.1:5090/api/v2/bookings?includeDeleted=true")
            $deleted = $allBookings | Where-Object { $_.id -eq $booking.id }
            if (-not $deleted -or -not $deleted.isDeleted) { throw "Soft-deleted booking was not retained for audit/history storage" }
            $repeatDeleteRejected = $false
            try { Invoke-RestMethod -Method Delete -Uri ("http://127.0.0.1:5090/api/v2/bookings/" + $booking.id) -ContentType "application/json; charset=utf-8" -Body $deleteBody | Out-Null }
            catch { if ($_.Exception.Response.StatusCode.value__ -eq 409) { $repeatDeleteRejected = $true } else { throw } }
            if (-not $repeatDeleteRejected) { throw "Repeated booking deletion was accepted" }
            Write-Host "Runtime workflow smoke test passed: admin security, booking flow, validation, list locks, move consistency and soft-delete integrity."
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Test watchdog automatic server recovery
        shell: pwsh
        run: |
          $watchdog = Join-Path (Resolve-Path "publish") "Server-Watchdog.ps1"
          $wd = Start-Process powershell.exe -ArgumentList @("-NoProfile","-ExecutionPolicy","Bypass","-File",$watchdog) -PassThru -WindowStyle Hidden
          try {
            $first = $null
            for ($i=0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 1
              try { $first = Invoke-RestMethod "http://127.0.0.1:5090/api/health" -TimeoutSec 2; break } catch {}
            }
            if (-not $first -or -not $first.pid) { throw "Watchdog did not start a healthy server" }
            $firstPid = [int]$first.pid
            Stop-Process -Id $firstPid -Force
            $second = $null
            for ($i=0; $i -lt 25; $i++) {
              Start-Sleep -Seconds 1
              try {
                $h = Invoke-RestMethod "http://127.0.0.1:5090/api/health" -TimeoutSec 2
                if ($h.pid -and [int]$h.pid -ne $firstPid) { $second=$h; break }
              } catch {}
            }
            if (-not $second) { throw "Watchdog failed to recover server after forced process termination" }
            Write-Host ("Watchdog recovery passed: PID {0} -> {1}" -f $firstPid,$second.pid)
          } finally {
            try { $h=Invoke-RestMethod "http://127.0.0.1:5090/api/health" -TimeoutSec 1; if($h.pid){Stop-Process -Id ([int]$h.pid) -Force} } catch {}
            if($wd -and -not $wd.HasExited){Stop-Process -Id $wd.Id -Force}
          }
      - name: Verify package contents
        shell: powershell
        run: |
          Get-ChildItem publish
          if (-not (Test-Path "publish\Start-Ultrasound-Server.cmd")) { throw "Server launcher missing" }
          if (-not (Test-Path "publish\Server-Watchdog.ps1")) { throw "Server watchdog missing" }
          if (-not (Test-Path "publish\Install-AutoStart.cmd")) { throw "Auto Start installer missing" }
          if (-not (Test-Path "publish\Install-AutoStart.ps1")) { throw "Auto Start PowerShell installer missing" }
          if (-not (Test-Path "publish\Setup-Network-Firewall.cmd")) { throw "Firewall helper missing" }
          if (-not (Test-Path "publish\NETWORK-SETUP.txt")) { throw "Network guide missing" }
          if (-not (Get-ChildItem "publish\*.exe")) { throw "Application EXE missing" }
      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: Ultrasound-Booking-System-Windows-x64
          path: publish
      - name: Create release ZIP
        shell: powershell
        run: Compress-Archive -Path publish\\* -DestinationPath Ultrasound-Booking-System-Windows-x64.zip -Force
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "Ultrasound-Booking-System-Windows-x64.zip"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            gh release upload latest $asset --clobber
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          throw "Release upload failed after 3 attempts"

