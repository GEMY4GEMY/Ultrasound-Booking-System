name: Windows x64 Build
permissions:
  contents: write
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Validate frontend JavaScript syntax
        shell: powershell
        run: node --check wwwroot/arabic-v2.js
      - name: Validate V2 dialog references
        shell: powershell
        run: |
          $html = Get-Content "wwwroot/index.html" -Raw
          $js = Get-Content "wwwroot/arabic-v2.js" -Raw
          $ids = [regex]::Matches($html, 'id="([^"]+Dlg)"') | ForEach-Object { $_.Groups[1].Value }
          $refs = [regex]::Matches($js, "([A-Za-z_][A-Za-z0-9_]*Dlg)=el\('([^']+Dlg)'\)") 
          foreach ($m in $refs) {
            $id = $m.Groups[2].Value
            if ($ids -notcontains $id) { throw "JavaScript dialog reference has no matching HTML id: $id" }
          }
          foreach ($id in $ids) {
            if ($js -match "\b$id\.(showModal|close)\(" -and $js -notmatch "$id=el\('$id'\)") {
              throw "Dialog used without explicit JavaScript reference: $id"
            }
          }
      - name: Validate all inline UI handlers
        shell: powershell
        run: |
          $html = Get-Content "wwwroot/index.html" -Raw
          $js = Get-Content "wwwroot/arabic-v2.js" -Raw
          $matches = [regex]::Matches($html, 'on(?:click|change|input|submit)="([A-Za-z_$][A-Za-z0-9_$]*)\s*\(')
          $handlers = $matches | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          foreach ($handler in $handlers) {
            if ($js -notmatch ("(?:async\s+)?function\s+" + [regex]::Escape($handler) + "\s*\(")) {
              throw "HTML event handler has no JavaScript function: $handler"
            }
          }
          Write-Host ("Validated {0} inline UI handlers." -f $handlers.Count)
      - name: Publish Windows x64
        run: dotnet publish --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output publish
      - name: Add network deployment tools
        shell: powershell
        run: |
          Copy-Item "Start-Ultrasound-Server.cmd" "publish\Start-Ultrasound-Server.cmd"
          Copy-Item "Setup-Network-Firewall.cmd" "publish\Setup-Network-Firewall.cmd"
          Copy-Item "NETWORK-SETUP.txt" "publish\NETWORK-SETUP.txt"
      - name: Runtime smoke test published server
        shell: powershell
        run: |
          $exe = (Get-ChildItem "publish\*.exe" | Select-Object -First 1).FullName
          $proc = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:5090/api/health" -TimeoutSec 2
                $ready = $true
                break
              } catch {}
            }
            if (-not $ready) { throw "Published server did not become healthy on port 5090" }
            $page = (Invoke-WebRequest "http://127.0.0.1:5090/" -UseBasicParsing).Content
            if ($page -notmatch 'arabic-v2\.js\?v=175') { throw "Published homepage does not reference the expected V2 JavaScript" }
            if ($page -match '[A-Za-z0-9_]+Dlg\.close\(\)') { throw "Published homepage still depends on browser-global dialog variables" }
            $js = (Invoke-WebRequest "http://127.0.0.1:5090/arabic-v2.js?v=175" -UseBasicParsing).Content
            if ($js -notmatch 'function\s+closeDialog\s*\(') { throw "Explicit dialog close handler is missing" }
            foreach ($fn in @('openListDialog','quick','openAdmin','openAbout','saveBooking')) {
              if ($js -notmatch ("function\s+" + $fn + "\s*\(")) { throw "Missing frontend handler: $fn" }
            }
            $lists = Invoke-RestMethod "http://127.0.0.1:5090/api/v2/lists"
            $doctors = Invoke-RestMethod "http://127.0.0.1:5090/api/v2/doctors"
            if (-not $doctors -or $doctors.Count -lt 1) { throw "No doctor is available for booking smoke test" }
            $doctor = [string]$doctors[0]
            $testDate = (Get-Date).Date.AddDays(365).ToString("yyyy-MM-dd")
            $listBody = @{ date=$testDate; doctor=$doctor; shift="صباحي"; actor="CI Smoke Test" } | ConvertTo-Json
            $list = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:5090/api/v2/lists" -ContentType "application/json; charset=utf-8" -Body $listBody
            if (-not $list.id) { throw "Daily list creation failed" }
            $phone = "01000000000"
            $bookingBody = @{ listId=$list.id; patientName="CI Patient"; phone=$phone; contractType="نقدي"; insurer=""; exam="CI Exam"; notes="Automated smoke test"; actor="CI Smoke Test" } | ConvertTo-Json
            $booking = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:5090/api/v2/bookings" -ContentType "application/json; charset=utf-8" -Body $bookingBody
            if (-not $booking.patientId) { throw "Booking did not receive a patient ID" }
            $patient = Invoke-RestMethod ("http://127.0.0.1:5090/api/v2/patients/by-phone?phone=" + $phone)
            if ($patient.patientId -ne $booking.patientId) { throw "Patient phone lookup did not return the booking patient ID" }
            $badBody = @{ listId=$list.id; patientName="CI Insured"; phone="01000000001"; contractType="تأمين"; insurer=""; exam="CI Exam"; actor="CI Smoke Test" } | ConvertTo-Json
            $rejected = $false
            try { Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:5090/api/v2/bookings" -ContentType "application/json; charset=utf-8" -Body $badBody | Out-Null }
            catch { if ($_.Exception.Response.StatusCode.value__ -eq 400) { $rejected = $true } else { throw } }
            if (-not $rejected) { throw "Insured booking without insurer was accepted" }
            Write-Host "Runtime workflow smoke test passed: list, cash booking, patient lookup and insurer validation."
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Verify package contents
        shell: powershell
        run: |
          Get-ChildItem publish
          if (-not (Test-Path "publish\Start-Ultrasound-Server.cmd")) { throw "Server launcher missing" }
          if (-not (Test-Path "publish\Setup-Network-Firewall.cmd")) { throw "Firewall helper missing" }
          if (-not (Test-Path "publish\NETWORK-SETUP.txt")) { throw "Network guide missing" }
          if (-not (Get-ChildItem "publish\*.exe")) { throw "Application EXE missing" }
      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: Ultrasound-Booking-System-Windows-x64
          path: publish
      - name: Create release ZIP
        shell: powershell
        run: Compress-Archive -Path publish\\* -DestinationPath Ultrasound-Booking-System-Windows-x64.zip -Force
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "Ultrasound-Booking-System-Windows-x64.zip"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            gh release upload latest $asset --clobber
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          throw "Release upload failed after 3 attempts"

