<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نظام حجز السونار</title><link rel="stylesheet" href="arabic-v2.css"></head><body>
<header><div><h1>نظام حجز السونار</h1><small>القوائم والحجز المركزي</small></div><div class="server">● السيرفر متصل</div><button onclick="openAdmin()">لوحة الأدمن</button></header>
<main><section class="bar"><button onclick="moveDay(-1)">‹ اليوم السابق</button><input id="day" type="date" onchange="selectDay(this.value)"><button onclick="moveDay(1)">اليوم التالي ›</button><button class="primary" onclick="openListDialog()">+ إنشاء قائمة</button><button class="primary" onclick="quick()">+ حجز سريع</button></section><section id="alerts" class="alerts"></section><section class="employee"><b>الموظف الحالي:</b> <span id="actor"></span> <button onclick="changeActor()">تغيير</button></section><section id="lists"></section></main>
<dialog id="listDlg"><form onsubmit="createList(event)"><h2>إنشاء قائمة جديدة</h2><label>التاريخ<input id="ldate" type="date" required></label><label>الطبيب<select id="ldoctor" required></select></label><label>الشفت<select id="lshift"><option>صباحي</option><option>مسائي</option></select></label><div class="actions"><button type="button" onclick="listDlg.close()">إلغاء</button><button class="primary">إنشاء</button></div></form></dialog>
<dialog id="bookDlg"><form onsubmit="saveBooking(event)"><h2>حجز حالة</h2><input id="bid" type="hidden"><input id="blist" type="hidden"><label>اسم المريض<input id="pname" required oninput="duplicateHint()"></label><div id="dup" class="warning hidden"></div><div class="grid"><label>رقم المريض ID<input id="pid" placeholder="تلقائي إذا ترك فارغًا"></label><label>رقم الهاتف<input id="phone" inputmode="numeric" maxlength="11" pattern="[0-9]{11}" required placeholder="11 رقم"></label></div><label>جهة التعاقد<select id="contract"><option>نقدي</option><option>تأمين</option></select></label><label>الفحص<input id="exam" required placeholder="اكتب الفحص يدوياً"></label><label>ملاحظات<textarea id="notes" rows="3"></textarea></label><div class="actions"><button type="button" onclick="bookDlg.close()">إلغاء</button><button class="primary">حفظ</button></div></form></dialog>
<dialog id="adminDlg"><div class="admin"><h2>لوحة الأدمن</h2><div id="adminGate"><input id="apin" type="password" inputmode="numeric" placeholder="PIN الأدمن"><button class="primary" onclick="adminLogin()">دخول</button></div><div id="adminBody" class="hidden"></div><button onclick="adminDlg.close()">إغلاق</button></div></dialog>
<script src="arabic-v2.js"></script></body></html>
